name: Quick evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/quick-eval.yml
      - scripts/quick_eval.py

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchvision==0.21.0 'numpy<2.3' ultralytics==8.3.120 onnx==1.17.0 pyyaml Pillow
      - name: Fetch pinned model weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fieldlens-weights
          gh release download model-assets --pattern disease.pt --pattern pest.pt --dir /tmp/fieldlens-weights
          echo 'd507f693b2ff1b8e0036f9b84fa9c6068d5931b40da720abf5d62d8833dd7281  /tmp/fieldlens-weights/disease.pt' | sha256sum --check
          echo '810f0df179aec54f5d9762a11df4a147ff87ef79ca46649151914eeed260237f  /tmp/fieldlens-weights/pest.pt' | sha256sum --check
      - name: Real-world mini-eval and CPU benchmark
        run: |
          python scripts/quick_eval.py --disease /tmp/fieldlens-weights/disease.pt --pest /tmp/fieldlens-weights/pest.pt --samples 64 --runs 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldlens-quick-evaluation
          path: evaluation/quick/
          if-no-files-found: warn
          retention-days: 30
