name: Windows installer
on:
  push:
    branches:
      - main
      - refactor/web-desktop-20261103
    paths:
      - 'dist/**'
      - 'desktop/**'
      - 'scripts/make_icon.py'
      - 'scripts/prepare-runtime.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm install --no-package-lock
      - name: Unit tests
        run: npm test
      - name: Prepare inference runtime
        run: npm run prepare-runtime
      - name: Generate icon
        run: |
          python -m pip install pillow
          python scripts/make_icon.py
      - name: Build NSIS installer
        run: npm run desktop:build
      - name: Check installer
        shell: pwsh
        run: |
          if (!(Test-Path "release/FieldLens-Setup-2.0.0-x64.exe")) { throw "Installer not found" }
          Get-Item "release/FieldLens-Setup-2.0.0-x64.exe" | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: FieldLens-Windows-Installer
          path: release/FieldLens-Setup-2.0.0-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v2.0.0
          name: FieldLens Desktop 2.0.0
          body: Windows x64 NSIS 安装程序，模型首次使用时下载并校验 SHA-256。
          files: release/FieldLens-Setup-2.0.0-x64.exe
          fail_on_unmatched_files: true
