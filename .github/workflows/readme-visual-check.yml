name: README visual review
on:
  push:
    branches:
      - design/readme-atlas-20261104
    paths:
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/readme-visual-check.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture GitHub README
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('readme-review');out.mkdir(exist_ok=True)
          url='https://github.com/cha290196-hue/FieldLens/tree/design/readme-atlas-20261104'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              for name,width,height,color in [('light',1440,1100,'light'),('dark',1440,1100,'dark'),('mobile',480,900,'light')]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1,color_scheme=color)
                  page.goto(url,wait_until='domcontentloaded',timeout=90000)
                  article=page.locator('article.markdown-body').first
                  article.wait_for(timeout=45000)
                  article.locator('img[alt="FieldLens — Visual Analysis"]').wait_for(timeout=20000)
                  article.locator('img[alt*="真实 ONNX 分类结果"]').wait_for(timeout=20000)
                  article.locator('img[alt*="像素吉祥物横幅"]').wait_for(timeout=20000)
                  page.wait_for_function("""() => [...document.querySelectorAll('article.markdown-body img')].filter(x => /assets\/(cover|readme-brand-dark|desktop-workbench|web-demo)/.test(x.currentSrc)).every(x => x.complete && x.naturalWidth > 0)""",timeout=25000)
                  ok=article.evaluate('(el)=>el.scrollWidth <= el.clientWidth + 3')
                  if not ok: raise AssertionError(f'{name} README overflow')
                  article.scroll_into_view_if_needed()
                  page.evaluate('window.scrollBy(0,-10)')
                  page.screenshot(path=str(out / f'{name}-first-fold.png'))
                  if name=='light': article.screenshot(path=str(out/'light-full-readme.png'))
                  print(name,article.count(),article.bounding_box(),flush=True)
                  page.close()
              browser.close()
          PY
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: README-Atlas-Visual-Review
          path: readme-review/
          if-no-files-found: ignore
          retention-days: 7
