name: Web demo
on:
  push:
    branches:
      - main
      - refactor/web-desktop-20261103
      - fix/onnx-quantized-cpu-compatibility
      - test/browser-inference-20261103
    paths:
      - 'dist/**'
      - 'scripts/prepare_models.py'
      - 'scripts/smoke_onnx.py'
      - 'scripts/smoke_browser.py'
      - 'scripts/prepare-runtime.js'
      - 'scripts/export_models.py'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm install --no-package-lock
      - name: Unit tests
        run: npm test
      - name: Prepare inference runtime
        run: npm run prepare-runtime
      - name: Install ONNX export dependencies
        run: pip install torch==2.6.0 torchvision==0.21.0 'numpy<2.3' ultralytics==8.3.120 onnx==1.17.0 onnxruntime==1.20.1
      - name: Prepare browser weights
        run: python scripts/prepare_models.py
      - name: Verify model assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for key, count in [('disease', 38), ('pest', 102)]:
              meta = json.loads(Path('dist/models/'+key+'.json').read_text())
              assert len(meta['labels']) == count
              assert Path('dist/models/'+key+'.onnx').stat().st_size > 15_000_000
          assert Path('dist/runtime/ort.webgpu.min.mjs').exists()
          PY
      - name: Check ONNX forward passes
        run: |
          pip install onnxruntime==1.20.1
          python scripts/smoke_onnx.py
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify browser inference
        run: python scripts/smoke_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: browser-check/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
