name: Publish demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm test
      - run: npm run prepare-runtime
      - run: pip install torch==2.6.0 torchvision==0.21.0 'numpy<2.3' ultralytics==8.3.120 onnx==1.17.0
      - name: Download model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fieldlens-weights
          gh release download model-assets --pattern disease.pt --pattern pest.pt --dir /tmp/fieldlens-weights
          echo 'd507f693b2ff1b8e0036f9b84fa9c6068d5931b40da720abf5d62d8833dd7281  /tmp/fieldlens-weights/disease.pt' | sha256sum --check
          echo '810f0df179aec54f5d9762a11df4a147ff87ef79ca46649151914eeed260237f  /tmp/fieldlens-weights/pest.pt' | sha256sum --check
      - name: Export browser models
        run: |
          mkdir -p "$RUNNER_TEMP/fieldlens-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/fieldlens-home" PYTHONNOUSERSITE=1 python scripts/export_models.py --disease /tmp/fieldlens-weights/disease.pt --pest /tmp/fieldlens-weights/pest.pt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
