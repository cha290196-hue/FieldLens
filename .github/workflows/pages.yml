name: Publish demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm test
      - run: npm run prepare-runtime
      - run: pip install ultralytics==8.3.120 onnx==1.17.0
      - name: Prepare model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fieldlens-weights
          gh release download model-assets --pattern disease.pt --pattern pest.pt --dir /tmp/fieldlens-weights
          python scripts/export_models.py --disease /tmp/fieldlens-weights/disease.pt --pest /tmp/fieldlens-weights/pest.pt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
